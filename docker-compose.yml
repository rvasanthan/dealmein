services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealmein}
      POSTGRES_USER: ${POSTGRES_USER:-dealmein}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dealmein}
      DATABASE_USER: ${POSTGRES_USER:-dealmein}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD_HASH: ${APP_ADMIN_PASSWORD_HASH:?set APP_ADMIN_PASSWORD_HASH in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      APP_TOKEN_TTL_MINUTES: ${APP_TOKEN_TTL_MINUTES:-480}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_DEFAULT_RETAILER_TIMEZONE: ${APP_DEFAULT_RETAILER_TIMEZONE:-America/New_York}
      APP_REPORTS_PER_HOUR: ${APP_REPORTS_PER_HOUR:-5}
      APP_UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

volumes:
  dbdata:
  uploads:
